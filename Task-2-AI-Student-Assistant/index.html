<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 AI Student Assistant</h1>
        <p>Your personal learning companion</p>

        <div id="chat-box">
            <div class="bot-message">
                Hello! 👋 How can I help you today?
            </div>
        </div>

        <form id="chat-form" class="input-area">
    <input type="text" id="user-input"
           placeholder="Ask your question..." required>
    <button type="submit">Send</button>
</form>

<p id="status" role="status"></p>

        <div class="suggestions">
            <button onclick="askQuestion('Explain AI simply')">
                Explain AI
            </button>
            <button onclick="askQuestion('Give me study tips')">
                Study tips
            </button>
            <button onclick="askQuestion('Help me with Python')">
                Python help
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
